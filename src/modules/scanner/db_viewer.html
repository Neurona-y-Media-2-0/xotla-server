<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AegisQRO — Datos Recibidos y Perfil de Conducta</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      background: #0b0e14;
      color: #e6edf3;
      line-height: 1.5;
    }
    .navbar {
      background: #121722;
      border-bottom: 1px solid #21293a;
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand { font-size: 16px; font-weight: 800; color: #fff; }
    .nav-links { display: flex; gap: 10px; }
    .nav-btn {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      color: #8b949e;
    }
    .nav-btn.active {
      background: #1f6feb;
      color: #fff;
    }
    .nav-btn:hover:not(.active) {
      background: #192030;
      color: #fff;
    }
    .container { max-width: 1200px; margin: 28px auto; padding: 0 20px 60px; }
    .card {
      background: #121722;
      border: 1px solid #21293a;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    h2 { margin: 0 0 12px; font-size: 16px; color: #fff; }
    .profile-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 10px;
    }
    .score-big { font-size: 28px; font-weight: 800; }
    table { width: 100%; border-collapse: collapse; font-size: 13.5px; text-align: left; }
    th {
      color: #8b949e;
      font-size: 11.5px;
      text-transform: uppercase;
      padding: 10px 12px;
      border-bottom: 1px solid #21293a;
    }
    td { padding: 12px; border-bottom: 1px solid #192030; vertical-align: top; }
    .mono {
      font-family: monospace;
      font-size: 12px;
      color: #79c0ff;
      background: #0b0e14;
      padding: 3px 7px;
      border-radius: 6px;
      border: 1px solid #21293a;
    }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }
    .b-bad { background: #f8514922; color: #ff7b72; border: 1px solid #f8514966; }
    .b-warn { background: #d2992222; color: #e3b341; border: 1px solid #d2992266; }
    .b-ok { background: #2ea04322; color: #3fb950; border: 1px solid #2ea04366; }
    ul { margin: 0; padding-left: 16px; }
    li { margin-bottom: 3px; }
    .muted { color: #8b949e; font-size: 12px; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="brand">AEGISQRO · MONITOR DE DATOS</div>
    <div class="nav-links">
      <a href="/dashboard" class="nav-btn">1. Cuenta, Grupos y Tokens</a>
      <a href="/db" class="nav-btn active">2. Ver Datos que Llegan</a>
    </div>
  </nav>

  <main class="container">
    <!-- 1. Resumen Rapido de Conducta -->
    <section class="card">
      <div class="profile-header">
        <div>
          <h2>Perfil de Conducta Actual</h2>
          <div id="conductSummary" style="font-size:14px; color:#c9d1d9;">Cargando...</div>
        </div>
        <div style="text-align:right;">
          <div id="conductScore" class="score-big" style="color:#ff7b72;">0.00</div>
          <span id="conductLevel" class="badge b-bad">CRITICAL</span>
        </div>
      </div>
    </section>

    <!-- 2. Archivos, Imagenes y URLs Recibidos -->
    <section class="card">
      <h2>Archivos, Imagenes y Mensajes que Llegan (con Hora y Como se Detecto)</h2>
      <table>
        <thead>
          <tr>
            <th>Hora</th>
            <th>Dispositivo</th>
            <th>Tipo</th>
            <th>Veredicto</th>
            <th>Como se detecto (Explicacion / LLM)</th>
            <th>SHA-256</th>
            <th>Temporal</th>
          </tr>
        </thead>
        <tbody id="incomingBody"></tbody>
      </table>
    </section>
  </main>

  <script>
    function bClass(val) {
      const v = String(val || "").toUpperCase();
      if (v.includes("MALICIOUS") || v.includes("CRITICAL") || v.includes("HIGH_RISK") || v.includes("PHISHING") || v.includes("BLOCKED")) {
        return "badge b-bad";
      }
      if (v.includes("MEDIUM") || v.includes("HIGH") || v.includes("FLAGGED") || v.includes("SUSPICIOUS")) {
        return "badge b-warn";
      }
      return "badge b-ok";
    }

    function fmtTime(iso) {
      if (!iso) return "-";
      const d = new Date(iso);
      return d.toLocaleTimeString("es-MX", { hour12: false }) + " (" + d.toLocaleDateString("es-MX") + ")";
    }

    const PERM_NAMES = {
      RECEIVE_SMS: "Lee SMS entrantes (roba codigos de verificacion)",
      READ_SMS: "Lee los SMS guardados",
      BIND_ACCESSIBILITY_SERVICE: "Servicio de Accesibilidad (puede controlar la pantalla)",
      SYSTEM_ALERT_WINDOW: "Dibuja ventanas encima de otras apps (phishing en pantalla)",
      REQUEST_INSTALL_PACKAGES: "Puede instalar otras apps sin permiso"
    };

    function humanizeReasons(reasons) {
      const out = [];
      const add = (t) => { if (t && !out.includes(t)) out.push(t); };

      (reasons || []).forEach((raw) => {
        const r = String(raw || "");
        let matched = false;

        const llm = r.match(/^\[LLM[^\]]*\]\s*(.*)$/i);
        if (llm) {
          const t = llm[1].trim();
          if (t.length >= 40 && !/^["'\u201c\u2018]/.test(t) && !/aqu[ií] tienes|mensaje en espa|respectivamente/i.test(t)) {
            add("IA: " + (t.length > 170 ? t.slice(0, 170) + "..." : t));
          }
          return;
        }

        const rob = r.match(/RoBERTa[^\]]*\]\s*(\w+).*?\(([\d.]+)%\)/i);
        if (rob) {
          add("RoBERTa: " + (/PHISH/i.test(rob[1]) ? "Phishing" : "Seguro") + " (" + rob[2] + "%)");
          return;
        }
        const hor = r.match(/Horizon[^\]]*\]\s*(\w+).*?\(([\d.]+)%\)/i);
        if (hor) {
          const lbl = { fraud: "Fraude", spam: "Spam", legitimate: "Legitimo" }[hor[1]] || hor[1];
          add("Horizon-Labs: " + lbl + " (" + hor[2] + "%)");
          return;
        }

        const perms = r.match(/permission\.[A-Z_]+/g);
        if (perms) {
          matched = true;
          perms.forEach((p) => {
            const key = p.replace("permission.", "");
            add("Permiso peligroso: " + (PERM_NAMES[key] || key));
          });
        }

        const doms = r.match(/(?:[a-z0-9-]+\.)*xn--[a-z0-9-]+(?:\.[a-z0-9-]+)*/gi);
        if (doms) {
          matched = true;
          Array.from(new Set(doms)).forEach((d) => add("Dominio falso (punycode): " + d));
        }

        if (/\/JS/.test(r)) { matched = true; add("PDF con JavaScript incrustado"); }
        if (/OpenAction/i.test(r)) { matched = true; add("PDF que ejecuta una accion solo al abrirse (/OpenAction)"); }
        if (/MIME spoofing/i.test(r)) { matched = true; add("El archivo dice ser un tipo pero por dentro es otro (MIME falso)"); }
        if (/Magic Bytes/i.test(r)) { matched = true; add("Imagen falsa: por dentro es un ejecutable"); }
        if (/powershell/i.test(r)) { matched = true; add("Contiene comandos PowerShell ocultos"); }

        const ck = r.match(/caracteres Cookie \((.*?)\)/i);
        if (ck) {
          matched = true;
          let host = ck[1];
          try { host = new URL(ck[1]).hostname.replace(/^\./, ""); } catch (e) {}
          add("Cookie de sesion sin proteccion en " + host);
        }

        if (!matched) {
          const t = r.replace(/\s+/g, " ").trim();
          if (t && !/^Dominios\/IPs en DEX/i.test(t) && !/^Inspeccion estatica/i.test(t)) {
            add(t.length > 150 ? t.slice(0, 150) + "..." : t);
          }
        }
      });

      if (out.length === 0) out.push("Sin amenazas encontradas");
      return out;
    }

    async function loadIncoming() {
      const [artsRes, profRes] = await Promise.all([
        fetch("/v1/scanner/artifacts"),
        fetch("/v1/ueba/profile/emp_042")
      ]);
      const artifacts = await artsRes.json();
      const prof = await profRes.json();

      document.getElementById("conductSummary").textContent = prof.llm_behavioral_summary || "";
      document.getElementById("conductScore").textContent = Number(prof.current_risk_score || 0).toFixed(2);
      document.getElementById("conductLevel").className = bClass(prof.risk_level);
      document.getElementById("conductLevel").textContent = prof.risk_level;

      document.getElementById("incomingBody").innerHTML = artifacts.map(a => `
        <tr>
          <td class="muted">${fmtTime(a.scanned_at)}</td>
          <td><span class="mono">${a.device_id}</span></td>
          <td><strong>${a.file_type}</strong><br><span class="muted">${a.detection_method}</span></td>
          <td><span class="${bClass(a.verdict)}">${a.verdict} (${Number(a.threat_score).toFixed(2)})</span></td>
          <td>
            <ul>
              ${humanizeReasons(a.detection_reasons).map(r => `<li>${r}</li>`).join("")}
            </ul>
          </td>
          <td><span class="mono" title="${a.artifact_sha256}">${(a.artifact_sha256 || "").slice(0, 12)}...</span></td>
          <td><span class="badge b-ok">${a.ephemeral_purged ? "Borrado" : "Activo"}</span></td>
        </tr>
      `).join("") || '<tr><td colspan="7" class="muted">Aun no llegan archivos</td></tr>';
    }

    loadIncoming();
    setInterval(loadIncoming, 3000);
  </script>
</body>
</html>
